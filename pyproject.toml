[project]
name = "crm-nightly-sync"
version = "0.1.0"
description = "Atomic, batched CRM to PostgreSQL synchronization"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0,<3.2",
    "Flask-SQLAlchemy>=3.1,<3.2",
    "SQLAlchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<3.3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
