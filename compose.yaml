services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm_sync_test
      POSTGRES_USER: crm_sync
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_sync -d crm_sync_test"]
      interval: 1s
      timeout: 3s
      retries: 30
